# Servicios — los tres niveles del Mapa de Madurez Digital de la PYME.
# Cada nivel resuelve un dolor distinto y tiene un factor humano principal.

- slug: landing
  icon: "🚀"
  nombre_corto: Landing
  titulo: Diseño y desarrollo web
  factor_humano: Audiencia
  meta: Visibilidad, alcance y captación de interés
  beneficio: Tu negocio visible y profesional
  resumen: >-
    Sitios rápidos, mobile-first y SEO-ready. Desde landings hasta sitios
    institucionales con blog y panel de contenidos.
  detalle: >-
    Sitios rápidos, arquitectura mobile-first, optimización SEO-ready
    para aparecer en buscadores, páginas de aterrizaje específicas,
    blogs y paneles de administración de contenido. Stack moderno
    (Next.js, Jekyll o WordPress según corresponda), hosting incluido
    en el Plan Cuidado, deploy automático y dominio profesional.

- slug: ecommerce
  icon: "🛒"
  nombre_corto: E-commerce
  titulo: E-commerce con IA
  factor_humano: Clientes
  meta: Conversión, monetización automática y facturación 24/7
  beneficio: Vende cuando no estás
  resumen: >-
    Tiendas en línea con catálogo dinámico, checkout simplificado por
    WhatsApp o pasarelas de pago, panel de administración y reportes.
  detalle: >-
    Tiendas en línea con catálogo dinámico inteligente, procesos de
    checkout simplificados por WhatsApp, pasarelas de pago integradas
    (tarjetas, billeteras digitales) y paneles de reportes. Stack
    Next.js + Supabase + Vercel. Integro chatbot de IA para responder
    consultas de productos y gestionar pedidos. Migración desde tiendas
    existentes incluida.

- slug: crm
  icon: "⚙️"
  nombre_corto: CRM
  titulo: Automatización y CRM para pymes
  factor_humano: Usuarios (equipo interno)
  meta: Eficiencia operativa, cero errores humanos y escalabilidad
  beneficio: Recupera el tiempo de tu equipo
  resumen: >-
    Conecto los sistemas que ya usas (Excel, formularios, WhatsApp,
    contabilidad) para que tu equipo deje de copiar y pegar.
  detalle: >-
    Análisis del flujo actual, propuesta de automatización con
    herramientas no invasivas (n8n, Make, scripts a medida),
    integración inteligente de sistemas existentes, capacitación
    al equipo y soporte mensual. Diseñado para liberar tiempo del
    equipo cuando el e-commerce desborda la capacidad manual.
