<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Elías Jurado · Tarjeta digital</title>
<meta name="description" content="Acompaño la madurez digital de tu pyme — de la visibilidad a la conversión, de la conversión a la eficiencia.">
<meta property="og:title" content="Elías Jurado">
<meta property="og:description" content="Landing web · E-commerce · CRM.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --carbon:    #000000;
    --steel:     #243038;
    --muted:     #606060;
    --aluminum:  #f5f5f7;
    --white:     #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: linear-gradient(160deg, var(--carbon) 0%, var(--steel) 100%);
    min-height: 100vh; min-height: 100dvh;
    font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: var(--carbon);
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%; max-width: 400px;
    background: var(--white);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }

  /* HEADER con gradiente carbón → steel y logo blanco */
  .head {
    background: linear-gradient(160deg, var(--carbon) 0%, var(--steel) 100%);
    padding: 44px 28px 32px;
    color: var(--white);
    text-align: center;
  }
  .head__logo {
    display: block;
    width: 200px;
    max-width: 100%;
    height: auto;
    margin: 0 auto 14px;
  }
  .head__name {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--white);
    margin: 0;
    text-transform: uppercase;
  }
  .head__tagline {
    font-size: 11px;
    font-weight: 500;
    color: var(--aluminum);
    opacity: 0.75;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 10px 0 0;
  }

  /* Lista de acciones sobre fondo blanco */
  .actions { padding: 20px 18px 8px; background: var(--white); }
  .btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--aluminum);
    color: var(--carbon);
    text-decoration: none;
    font-size: 15px; font-weight: 500;
    margin-bottom: 10px;
    border: 1px solid transparent;
    transition: all 0.18s ease;
    cursor: pointer;
  }
  .btn:hover, .btn:active {
    background: var(--white);
    border-color: var(--carbon);
    transform: translateY(-1px);
  }
  .btn .ico {
    flex-shrink: 0; width: 38px; height: 38px;
    display: grid; place-items: center;
    background: var(--carbon); color: var(--white);
    font-size: 14px;
    font-weight: 700;
  }
  .btn.whatsapp .ico { background: #25D366; color: var(--white); }
  .btn .label-r {
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .btn .text { display: flex; flex-direction: column; gap: 2px; }
  .btn .value { font-weight: 600; color: var(--carbon); font-size: 14.5px; }

  /* Acciones secundarias */
  .secondary {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; padding: 8px 18px 22px;
    background: var(--white);
  }
  .btn-2 {
    text-align: center; padding: 14px 10px;
    background: var(--carbon); color: var(--white);
    font-size: 13px; font-weight: 600;
    text-decoration: none; cursor: pointer; border: none;
    font-family: inherit;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    transition: all 0.18s ease;
  }
  .btn-2.outline {
    background: transparent; color: var(--carbon);
    border: 1.5px solid var(--carbon);
  }
  .btn-2:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-2.outline:hover { background: var(--aluminum); }

  /* Footer */
  .foot {
    padding: 18px 24px 22px; text-align: center;
    background: var(--white);
    border-top: 1px solid var(--aluminum);
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.4px;
    line-height: 1.7;
  }
  .foot a { color: var(--carbon); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<main class="card">
  <header class="head">
    <!-- Logo blanco oficial Miki sobre gradiente carbón → steel -->
    <img class="head__logo" src="/assets/images/logo/logo-blanco.svg" alt="Elías Jurado">
    <h1 class="head__name">Elías Jurado</h1>
    <p class="head__tagline">Landing · E-commerce · CRM</p>
  </header>

  <nav class="actions" aria-label="Contacto">
    <a class="btn whatsapp" href="https://wa.me/51902050617?text=Hola%20El%C3%ADas%2C%20te%20escribo%20desde%20tu%20tarjeta%20digital." target="_blank" rel="noopener">
      <span class="ico" aria-hidden="true">💬</span>
      <span class="text">
        <span class="label-r">WhatsApp</span>
        <span class="value">+51 902 050 617</span>
      </span>
    </a>
    <a class="btn" href="tel:+51902050617">
      <span class="ico" aria-hidden="true">📞</span>
      <span class="text">
        <span class="label-r">Llamar</span>
        <span class="value">+51 902 050 617</span>
      </span>
    </a>
    <a class="btn" href="mailto:info@eliasjurado.com">
      <span class="ico" aria-hidden="true">✉</span>
      <span class="text">
        <span class="label-r">Correo</span>
        <span class="value">info@eliasjurado.com</span>
      </span>
    </a>
    <a class="btn" href="https://eliasjurado.com" target="_blank" rel="noopener">
      <span class="ico" aria-hidden="true">🌐</span>
      <span class="text">
        <span class="label-r">Sitio web</span>
        <span class="value">eliasjurado.com</span>
      </span>
    </a>
  </nav>

  <div class="secondary">
    <button class="btn-2" onclick="downloadVCard()">Guardar contacto</button>
    <button class="btn-2 outline" onclick="shareCard()">Compartir</button>
  </div>

  <footer class="foot">
    Miraflores · Lima · Perú · RUC 10434645421<br>
    <a href="https://eliasjurado.com">eliasjurado.com</a>
  </footer>
</main>

<script>
function downloadVCard() {
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "FN:Elías Jurado",
    "N:Jurado;Elías;Luis;;",
    "ORG:Elías Jurado",
    "TITLE:Landing web · E-commerce · CRM",
    "TEL;TYPE=CELL,VOICE:+51902050617",
    "EMAIL;TYPE=WORK:info@eliasjurado.com",
    "URL:https://eliasjurado.com",
    "ADR;TYPE=WORK:;;;Miraflores;Lima;;Perú",
    "NOTE:Acompaño la madurez digital de tu pyme — de la visibilidad a la conversión\\, de la conversión a la eficiencia.",
    "END:VCARD"
  ].join("\r\n");
  const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "elias-jurado.vcf";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
}
async function shareCard() {
  const data = {
    title: "Elías Jurado",
    text: "Landing · E-commerce · CRM",
    url: location.href
  };
  if (navigator.share) {
    try { await navigator.share(data); } catch {}
  } else {
    try {
      await navigator.clipboard.writeText(location.href);
      alert("Enlace copiado al portapapeles.");
    } catch {
      prompt("Copia este enlace:", location.href);
    }
  }
}
</script>

</body>
</html>
